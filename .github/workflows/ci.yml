name: TT_SQL_PLATFORM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/agent-service/requirements.txt
      - run: cd services/agent-service && python -m pytest tests/unit/ -v --tb=short
      - run: cd services/agent-service && python -m pytest tests/integration/ -v --tb=short

  gateway-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd services/gateway && go build ./cmd/server/...
      - run: cd services/gateway && go test ./... 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/agent-service/core/ --ignore E501,F401,F403 || true
