name: TT_SQL_PLATFORM Security

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r services/agent-service/ -ll --exclude services/agent-service/tests || true

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r services/agent-service/requirements.txt || true
