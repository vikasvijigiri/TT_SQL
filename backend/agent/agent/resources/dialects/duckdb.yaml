dialect: "{DIALECT}"

rules:

  # ── IDENTIFIERS ──────────────────────────────────────────────────────
  - "DuckDB is case-insensitive by default. Double-quote identifiers only when the schema has mixed-case or special characters. Use exact casing from the schema."
  - "Every identifier must exist verbatim in the provided schema. Never invent table or column names."
  - "Never reference a SELECT-level alias in WHERE or HAVING — use a CTE or subquery instead."
  - "Never use reserved keywords (like 'group', 'order', 'date') as table or column aliases without double-quoting."

  # ── CROSS-DATABASE JOINS (SQLite auto-attach) ─────────────────────────
  - "When the dataset spans multiple files (e.g., a DuckDB file and SQLite .db files), the executor auto-attaches the SQLite files and creates TEMP VIEWs for all tables. Use the table names directly without any schema prefix — e.g., SELECT * FROM tracks JOIN sales ON tracks.track_id = sales.track_id."
  - "Do NOT use schema prefixes like 'main.' or 'sqlite.' for auto-attached tables. The TEMP VIEWs are accessible in the default namespace."
  - "When joining across auto-attached tables, verify the join key column names match the schema exactly."

  # ── TEMPORAL ────────────────────────────────────────────────────────
  - "Never use CURRENT_DATE, NOW(), or GETDATE(). All date-relative logic MUST use the reference date from the query context ({REFERENCE_DATE}) if provided."
  - "Date arithmetic: use INTERVAL syntax — date_col + INTERVAL '3 months', date_col - INTERVAL '1 year'. Or use DATEADD('month', -3, date_col)."
  - "Never compare DATE or TIMESTAMP to a bare string literal. Convert: TO_DATE('2022-11-25', 'YYYY-MM-DD') or CAST('2022-11-25' AS DATE)."
  - "DATE_TRUNC('month', col) for period grouping. DATE_PART('year', col) or EXTRACT(YEAR FROM col) for components."
  - "strftime('%Y-%m', col) also works in DuckDB for date formatting."
  - "To compute a decade (e.g., 2020s) from a 4-digit year: (CAST(year_col AS INTEGER) / 10) * 10 — yields 2020 for years 2020-2029. Never use modulo or operations that yield 2-digit results like 20 or 10."

  # ── TYPE CASTING ────────────────────────────────────────────────────
  - "DuckDB is strict about types. When a column is stored as TEXT/VARCHAR but contains numbers or dates, always CAST explicitly: CAST(col AS DOUBLE), CAST(col AS INTEGER), CAST(col AS DATE)."
  - "For dirty or mixed-type columns, use TRY_CAST(col AS TYPE) — returns NULL on failure instead of raising an error."
  - "Use COALESCE(TRY_CAST(col AS DOUBLE), 0) for numeric aggregations on TEXT columns that may contain non-numeric values."

  # ── REGEX AND STRING FUNCTIONS ───────────────────────────────────────
  - "regexp_extract(string, pattern, group) is a built-in DuckDB function — use it for regex-based extraction. Example: CAST(regexp_extract(col, '(19[0-9]{2}|20[0-9]{2})', 1) AS INTEGER). No workarounds needed."
  - "When a text column contains structured IDs or codes embedded in sentences (e.g., 'patient TCGA-AB-1234 has...'), use regexp_extract to pull the ID before joining: regexp_extract(col, '(PATTERN)', 1). Always inspect sample values to discover the embedded pattern."
  - "When join keys use different prefixes or formats but share the same numeric/suffix portion (e.g., 'purchaseid_42' and 'bookid_42'), derive the join via REPLACE or SUBSTR: REPLACE(a.id, 'purchaseid_', 'bookid_') = b.id. Identify this pattern by comparing sample values from both columns."
  - "regexp_matches(col, pattern) returns TRUE/FALSE for pattern matching. REGEXP_REPLACE(col, pattern, replacement) replaces matches."
  - "ILIKE for case-insensitive pattern matching. LIKE for case-sensitive. Use ILIKE when matching against user-provided strings or category values."
  - "String functions: TRIM, LTRIM, RTRIM, LOWER, UPPER, LENGTH, REPLACE, SUBSTR, CONCAT, || operator."
  - "SPLIT_PART(col, delimiter, n) extracts the nth part of a delimited string (1-based)."

  # ── JSON FUNCTIONS ───────────────────────────────────────────────────
  - "For JSON columns (stored as TEXT): use json_extract_string(col, '$.field') to get text values, json_extract(col, '$.field') for typed values."
  - "json_extract_string(col, '$.key') returns VARCHAR. json_extract(col, '$.key') returns JSON type — cast explicitly."
  - "For JSON arrays, use json_array_length(col) and json_extract(col, '$[0]') for element access."
  - "Alternatively, DuckDB supports arrow operators: col->'$.key' (returns JSON), col->>'$.key' (returns text)."

  # ── NULL HANDLING ───────────────────────────────────────────────────
  - "COUNT(col) excludes NULLs. COUNT(*) includes all rows. SUM returns NULL if all values are NULL — wrap with COALESCE(SUM(col), 0)."
  - "Check JOIN keys for NULLs. Add IS NOT NULL filters on join keys when NULLs should be excluded."
  - "Prevent division-by-zero: CAST(numerator AS DOUBLE) / NULLIF(denominator, 0). Use NULLIF instead of CASE WHEN."
  - "Filter out NULL or garbage string values (e.g., NULL, 'null', 'N/A', 'unknown', '[untitled]', 'NaN') before aggregating when data quality is suspect."

  # ── AGGREGATION ─────────────────────────────────────────────────────
  - "Every non-aggregated SELECT column MUST appear in GROUP BY, or be used in an aggregate function."
  - "DuckDB allows GROUP BY alias from SELECT — e.g., SELECT EXTRACT(YEAR FROM col) AS yr, COUNT(*) FROM t GROUP BY yr — but verify behavior."
  - "WHERE filters rows before aggregation. HAVING filters after. Never filter aggregate results in WHERE."
  - "For EMA (Exponential Moving Average): use window function with frame ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW."

  # ── WINDOW FUNCTIONS ────────────────────────────────────────────────
  - "Every window function requires explicit OVER(). Specify PARTITION BY and/or ORDER BY as needed."
  - "ROW_NUMBER() OVER(PARTITION BY key ORDER BY col DESC) for deduplication — then filter rn = 1 in outer query or CTE."
  - "Use QUALIFY ROW_NUMBER() OVER(...) = 1 to filter window results inline (DuckDB supports QUALIFY)."
  - "LAG/LEAD require ORDER BY inside OVER(). Always specify offset and default."
  - "For running totals: SUM(col) OVER(PARTITION BY key ORDER BY order_col ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)."

  # ── JOINS ───────────────────────────────────────────────────────────
  - "INNER JOIN: intersection only. LEFT JOIN: preserve all left rows. Prefer LEFT over RIGHT JOIN (rewrite as LEFT)."
  - "Every JOIN requires ON with fully qualified table.column on both sides. Avoid USING with potentially ambiguous columns."
  - "Watch for row multiplication when joining on non-unique keys — deduplicate the non-unique side first with ROW_NUMBER()."
  - "For multi-table datasets, join on authoritative key columns. Verify join cardinality before aggregating."

  # ── CTE AND SUBQUERY ────────────────────────────────────────────────
  - "Prefer CTEs over nested subqueries. Each CTE maps to one logical step."
  - "Name CTEs descriptively in snake_case. Never use generic names like cte1, tmp."
  - "Every subquery in FROM requires an explicit alias."

  # ── SYNTAX ──────────────────────────────────────────────────────────
  - "End single statements with a semicolon. In multi-statement scripts, end each statement with semicolon."
  - "LIMIT N should always be paired with ORDER BY for deterministic results."
  - "DuckDB supports SAMPLE clause for approximate queries — but avoid unless explicitly needed."
  - "Use DISTINCT to eliminate duplicate rows when the query asks for unique values."

examples:
  - name: "Cross-DB join with type casting and window function"
    sql: |
      WITH ranked_sales AS (
        SELECT
          t.title,
          SUM(s.revenue_usd) AS total_revenue,
          ROW_NUMBER() OVER(ORDER BY SUM(s.revenue_usd) DESC) AS rn
        FROM tracks t
        JOIN sales s ON t.track_id = s.track_id
        WHERE t.title IS NOT NULL
          AND t.title NOT IN ('unknown', '[untitled]', 'n.a.')
        GROUP BY t.title
      )
      SELECT title, total_revenue
      FROM ranked_sales
      WHERE rn = 1

  - name: "Date range filter with INTERVAL and decade computation"
    sql: |
      SELECT
        (CAST(EXTRACT(YEAR FROM TO_DATE(pub_date, 'YYYY-MM-DD')) AS INTEGER) / 10) * 10 AS decade,
        COUNT(*) AS total
      FROM publications
      WHERE TO_DATE(pub_date, 'YYYY-MM-DD') >= TO_DATE('2020-01-01', 'YYYY-MM-DD')
      GROUP BY decade
      ORDER BY decade DESC
