dialect: "{DIALECT}"

rules:

  # ── IDENTIFIERS ──────────────────────────────────────────────────────
  - "Double-quote every table and column using exact SCHEMA casing. Unquoted identifiers fold to UPPERCASE and fail silently."
  - "Every identifier must exist verbatim in SCHEMA. No assumed, abbreviated, or pluralised names."
  - "Table function outputs (VALUE, INDEX, PATH, KEY, SEQ) are UPPERCASE. Never quote them. Never apply source column casing to them."
  - "Never reference a SELECT-level alias in WHERE or HAVING."
  - "Never use reserved keywords as CTE names or aliases without double-quoting. Use snake_case."

  # ── VARIANT ──────────────────────────────────────────────────────────
  - "Access VARIANT object keys using colon notation without single quotes: \"col\":\"key\"::TYPE. Nested: \"col\":\"k1\".\"k2\"::TYPE. Alternative: GET_PATH(\"col\", 'key')::TYPE. Always cast to explicit type. Never use dot notation or single-quoted keys after colon."
  - "Access array elements with zero-based bracket notation and explicit cast: \"col\"[0]::TYPE. If the index is not deterministic, escalate to missing_elements."
  - "Valid cast suffixes: ::STRING (never ::VARCHAR), ::INTEGER, ::FLOAT, ::BOOLEAN, ::DATE, ::TIMESTAMP_NTZ, ::TIMESTAMP_TZ, ::VARIANT only when downstream accepts VARIANT."
  - "A missing VARIANT key returns NULL silently and excludes rows from equality filters. Add IS NULL OR condition when absent-key rows must be included. Document the decision."
  - "Render array expansion as LATERAL FLATTEN in FROM: FROM \"TABLE\", LATERAL FLATTEN(input => \"TABLE\".\"col\") AS f. Reference via f.VALUE::TYPE, f.VALUE:\"key\"::TYPE, f.INDEX, f.PATH. Never use FLATTEN without LATERAL. Never use LATERAL FLATTEN inside an EXISTS, IN, or scalar subquery. Never use LATERAL FLATTEN with an ON join predicate or OUTER JOIN syntax. Always place LATERAL FLATTEN directly in the main FROM clause."
  - "Test array membership with ARRAY_CONTAINS. First argument MUST be ::VARIANT cast: ARRAY_CONTAINS('v'::VARIANT, \"col\"). Never use IN, =, or LIKE against ARRAY or VARIANT columns."
  - "Wrap STRING/TEXT columns storing JSON in PARSE_JSON before colon notation or ARRAY_CONTAINS. Skip PARSE_JSON if column type is already VARIANT."
  - "Build objects: OBJECT_CONSTRUCT('k', col). Aggregate to array: ARRAY_AGG(\"col\"). Ordered: ARRAY_AGG(\"col\") WITHIN GROUP (ORDER BY \"col\"). Exclude nulls: ARRAY_AGG(\"col\") IGNORE NULLS."

  # ── TEMPORAL ────────────────────────────────────────────────────────
  - "Never use CURRENT_DATE, CURRENT_TIMESTAMP, NOW, SYSDATE, or GETDATE. All date-relative logic MUST use {REFERENCE_DATE}. Date: DATEADD(day, -N, TO_DATE({REFERENCE_DATE})). Timestamp: DATEADD(day, -N, TO_TIMESTAMP_NTZ({REFERENCE_DATE}))."
  - "DATEADD(unit, amount, col) and DATEDIFF(unit, start, end). Always specify unit: year, quarter, month, week, day, hour, minute, second."
  - "Never compare DATE or TIMESTAMP to a bare string literal. DATE: TO_DATE('val', 'YYYY-MM-DD'). TIMESTAMP_NTZ: TO_TIMESTAMP_NTZ('val'). TIMESTAMP_TZ: TO_TIMESTAMP_TZ('val')."
  - "DATE_TRUNC('part', \"col\") for grouping or filtering. Returns TIMESTAMP — add ::DATE if DATE type needed."
  - "DATE_PART('part', \"col\") or EXTRACT(part FROM \"col\"). Both return FLOAT — add ::INTEGER if needed."
  - "Detect storage unit from magnitude before converting: 10-digit -> seconds -> TO_TIMESTAMP(col). 13-digit -> milliseconds -> TO_TIMESTAMP(col / 1000). 16-digit -> microseconds -> TO_TIMESTAMP(col / 1000000)."

  # ── NULL HANDLING ───────────────────────────────────────────────────
  - "Check JOIN keys for NULLs. Use EQUAL_NULL(a, b) for NULL-safe equality. Add IS NOT NULL filter on join key if NULLs inflate results."
  - "COUNT(col) excludes NULLs. COUNT(*) includes all. SUM returns NULL if all values NULL — use COALESCE(SUM(col), 0). Never use ISNULL() — use COALESCE."
  - "Prevent division-by-zero: numerator / NULLIF(denominator, 0). Use NULLIF over CASE WHEN for conciseness."

  # ── TYPE CASTING ────────────────────────────────────────────────────
  - "Normalize all casts to double-colon notation: col::TYPE. Type aliases: VARCHAR/TEXT → STRING. INT/BIGINT → INTEGER. DOUBLE/DECIMAL → FLOAT. DATETIME → TIMESTAMP_NTZ. Never use ::VARCHAR."
  - "Use TRY_CAST(col AS TYPE) when a column may contain unconvertible values and NULL on failure is acceptable. Do not use TRY_CAST as a default — only for known dirty or mixed-type columns."

  # ── STRING ──────────────────────────────────────────────────────────
  - "SUBSTR(col, start, len) [1-based]. POSITION(sub IN col). CONCAT(a, b) or a || b. UPPER/LOWER/TRIM/LTRIM/RTRIM/LENGTH/REPLACE. SPLIT(col, delim) returns ARRAY. Never use SUBSTRING()."
  - "Exact: col = 'val'. Case-sensitive pattern: LIKE. Case-insensitive: ILIKE. Regex match: REGEXP_LIKE. Regex extract: REGEXP_SUBSTR. Regex replace: REGEXP_REPLACE. Never use SIMILAR TO."

  # ── AGGREGATION ─────────────────────────────────────────────────────
  - "Every non-aggregated SELECT column MUST appear in GROUP BY. Never use positional GROUP BY references."
  - "WHERE filters before aggregation. HAVING filters after. Never filter on aggregate results in WHERE. Never use HAVING for non-aggregated column filters."
  - "COUNT(DISTINCT col) is exact. Use APPROX_COUNT_DISTINCT or HLL only when query explicitly requires approximate counting."

  # ── WINDOW FUNCTIONS ────────────────────────────────────────────────
  - "Every window function requires explicit OVER(). Always specify PARTITION BY and/or ORDER BY as required by intent."
  - "Specify frame for row-range functions: Running total: ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. Omit frame only for ROW_NUMBER, RANK, DENSE_RANK, NTILE, LAG, LEAD."
  - "ROW_NUMBER: unique, no ties. RANK: ties with gaps. DENSE_RANK: ties without gaps. Use ROW_NUMBER for deduplication. Never use RANK when downstream logic assumes no gaps."
  - "LAG/LEAD require ORDER BY inside OVER. Always specify offset and default value. LAG/LEAD without ORDER BY is non-deterministic."
  - "Use QUALIFY to filter window results without a subquery wrapper: QUALIFY ROW_NUMBER() OVER(...) = 1"

  # ── JOINS ───────────────────────────────────────────────────────────
  - "INNER: intersection only. LEFT: preserve all left rows. Avoid RIGHT JOIN — rewrite as LEFT. FULL OUTER: all rows both sides. CROSS: cartesian — only when explicitly required. Never implicit joins."
  - "Every JOIN requires ON with fully qualified TABLE.COLUMN on both sides. Never use USING or unqualified column names."
  - "Row multiplication occurs when both join sides are non-unique on the join key. Deduplicate the non-unique side with ROW_NUMBER() OVER(PARTITION BY join_key ORDER BY authoritative_col DESC) QUALIFY rn = 1 before joining."

  # ── CTE AND SUBQUERY ────────────────────────────────────────────────
  - "Prefer CTEs over nested subqueries. Each CTE maps to one logical step. Never use anonymous subqueries when a CTE name is available."
  - "Name CTEs in snake_case reflecting logical purpose. Never use generic names like cte1, cte2, tmp."
  - "Every subquery in FROM, WHERE, or SELECT requires an explicit alias. Anonymous subqueries cause compile errors."

  # ── GEOSPATIAL ──────────────────────────────────────────────────────
  - "Never apply spatial predicates to BINARY or STRING columns. Wrap first: WKB → ST_GEOGRAPHYFROMWKB(col). WKT → ST_GEOGRAPHYFROMWKT(col). GeoJSON → ST_GEOGRAPHYFROMGEOJSON(col). Apply to both predicate operands. Default SRID: 4326."
  - "ST_DISTANCE (meters), ST_WITHIN, ST_INTERSECTS, ST_DWITHIN (meters), ST_CONTAINS. Never mix GEOGRAPHY and GEOMETRY."

  # ── SYNTAX ──────────────────────────────────────────────────────────
  - "Single statement: no trailing semicolon. Multi-statement: semicolon after every statement except the last."
  - "Remove all -- and /* */ comments before execution. Never strip comment-like characters inside string literals."
  - "LIMIT N always paired with ORDER BY for deterministic results."
  - "All SQL keywords in UPPERCASE."

examples:
  - name: "Standard Analytical Query with CTEs, Double-Quoted Identifiers, and LATERAL FLATTEN"
    sql: |
      WITH "filtered_users" AS (
        SELECT "user_id", "created_at"
        FROM "PROD_DB"."USERS_SCHEMA"."USER_ACCOUNTS"
        WHERE "status" = 'ACTIVE'
      ),
      "user_events" AS (
        SELECT 
          u."user_id",
          ev.VALUE:"event_name"::STRING AS "event_name",
          ev.VALUE:"payload"."duration_ms"::INTEGER AS "duration_ms"
        FROM "filtered_users" AS u
        INNER JOIN "PROD_DB"."EVENTS_SCHEMA"."EVENT_LOGS" AS el ON u."user_id" = el."user_id",
          LATERAL FLATTEN(input => el."raw_event_array") AS ev
        WHERE ev.VALUE:"event_name"::STRING = 'CLICK'
      )
      SELECT "event_name", COUNT(*) AS "total_clicks", AVG("duration_ms") AS "avg_duration"
      FROM "user_events"
      GROUP BY "event_name"
      ORDER BY "total_clicks" DESC
      LIMIT 10

  - name: "Window Deduplication & Microsecond Timestamp Scaling"
    sql: |
      WITH "deduplicated_commits" AS (
        SELECT 
          "repo_name",
          "author_email",
          TO_TIMESTAMP_NTZ("commit_timestamp_micro" / 1000000) AS "commit_time",
          ROW_NUMBER() OVER(PARTITION BY "repo_name", "commit_hash" ORDER BY "commit_timestamp_micro" DESC) AS rn
        FROM "GITHUB"."REPOS"."COMMITS"
      )
      SELECT "repo_name", COUNT(*) AS "unique_commits"
      FROM "deduplicated_commits"
      WHERE rn = 1 AND DATE_TRUNC('month', "commit_time") = TO_DATE('2023-01-01', 'YYYY-MM-DD')
      GROUP BY "repo_name"
      ORDER BY "unique_commits" DESC