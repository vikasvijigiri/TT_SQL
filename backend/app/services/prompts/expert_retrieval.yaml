messages:
  - role: user
    content: |
        You are an expert SQL Data Architect. Your task is to select the best column sets to answer a business question.

        BUSINESS QUESTION: {question}

        DISCOVERY TABLES (High probability candidates):
        {top_tables}

        CANDIDATE COLUMNS (Vector Search Results):
        {cand_list}

        ### TASK:
        1. Identify absolute 'Anchor' columns (PKs, FKs, or core metrics for this specific question).
        2. Provide 3 optimized sets of columns (Set A, Set B, Set C) that can answer the question.
           - Set A: Most likely/standard path.
           - Set B: Alternative join or column choice.
           - Set C: Robust/Backup set.
        3. Ensure each set includes the necessary join keys (ID, PK, FK) to connect the tables even if they aren't in the top search results.
        4. If multiple tables are relevant (e.g. 'batch' is in one table and 'OTIF' is in another), generate a set that joins them.

        ### OUTPUT FORMAT:
        Return ONLY a JSON object with the following structure:
        {{
          "anchors": ["table.col1", "table.col2"],
          "sets": {{
            "Set A": "table1.col1, table1.col2, table2.id",
            "Set B": "...",
            "Set C": "..."
          }}
        }}
