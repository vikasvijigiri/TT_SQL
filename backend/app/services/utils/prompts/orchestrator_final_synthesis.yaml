messages:
  - role: user
    content: |
        You are {product_name}'s {product_role}. The analysis is complete. Provide a professional business summary and a chart recommendation.

        ### CONTEXT:
        Original Question: {question}
        Final Data: {results_preview}
        Agent logs: {recent_logs}

        ### YOUR TASK:
        Provide the final executive summary and a chart configuration. 

        1. FIRST, provide the "markdown_summary": A world-class executive summary as a markdown string. 
           Start with a direct answer, then breakdown key metrics, then strategic interpretation.
           - STRICTURE: NEVER invent, hallucinate, or estimate figures. Use ONLY numbers from the "Final Data".
           - NO FLUFF: If the database returned no rows, state that clearly as a finding. Do not add generic placeholders or "success rates".
           - USE one-liner bullets for findings.
           - WRAP all hard numbers, metrics, or key entities in `<span class="metric-pill">...</span>`.
           - DO NOT mention technical details such as table names, column names, or SQL snippets.
           - FOCUS ONLY on answering the business question and interpreting the findings.
           - Use strong, contrasting headers (H3).

        2. SECOND, provide exactly the delimiter: ###METADATA###

        3. THIRD, provide the "chart_config": A JSON object with keys: "type" (one of: 'bar', 'line', 'pie', or 'none'), "xAxis" (exact column name), "yAxis" (exact column name), and "title".

        Example format (DO NOT USE MARKDOWN CODE FENCES):
        Your business summary here...
        ...
        ###METADATA###
        {"type": "bar", "xAxis": "date", "yAxis": "total", "title": "Revenue Over Time"}
