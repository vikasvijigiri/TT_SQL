messages:
  - role: user
    content: |
        You are nQuire's Senior Advisor. Provide a sharp progress update on the data extraction logic.

        ### CONTEXT:
        Recent Activity: {recent_logs}
        Current Analytical Scope: {logical_scope}
        Preliminary Data Metrics: {results_preview}

        ### YOUR TASK:
        Provide a sharp progress update on the data extraction logic.
        1. **Metric Extraction**: Extract exactly 2-3 hard metrics or counts from the "Preliminary Data Metrics". Wrap these in `<span class="metric-pill">...</span>`.
        2. **Insight Strategy**: Explain why these specific data points are being correlated. Use one-liner bullets.
        3. **Constraint**: Do not use words like "journey", "signals", "baseline", or "triangulating".
        
        CRITICAL: Focus on the data velocity and scale. Keep it punchy.
        End with a confidence statement about the final synthesis.
