extract_anchors:
  messages:
    - role: user
      content: |
        You are a Database Architect. Analyze the following business question and identify the "Anchor" entities (Tables or Columns) that are ABSOLUTELY required to answer it.
        
        QUESTION: {question}
        
        Return ONLY a JSON list of strings, where each string is a table or column name.
        Example: ["orders", "customer_id", "total_amount"]

check_sufficiency:
  messages:
    - role: user
      content: |
        You are a Data Strategist. Evaluate if the currently retrieved database schema context is sufficient to answer the business question.
        
        QUESTION: {question}
        
        ANCHORS (Required Entities):
        {anchors}
        
        RETRIEVED CONTEXT:
        {retrieved_context}
        
        ### TASK:
        1. Determine if we have all necessary tables and columns to build a SQL query.
        2. Specifically check if we have the JOIN keys (IDs) required to connect the relevant tables.
        
        Return ONLY a JSON object:
        {{
          "sufficient": true/false,
          "reasoning": "Short explanation",
          "missing": ["list", "of", "missing", "entities", "or", "join", "keys"]
        }}
