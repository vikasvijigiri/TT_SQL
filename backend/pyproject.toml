[project]
name = "tt-sql"
version = "0.1.0"
description = ""
authors = [
    {name = "vikas.v@ngenux.com",email = "vikas.v@ngenux.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "python-dotenv",
    "psycopg2-binary",
    "openai",
    "qdrant-client",
    "sentence-transformers",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"] # Ignore long line errors (handled by line-length)

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[tool.poetry]
packages = [{include = "tt_sql", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
