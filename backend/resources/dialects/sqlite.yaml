dialect: "{DIALECT}"

rules:
  - "Quote identifiers only when needed for mixed-case or reserved names, but always stay consistent with the exact schema names."
  - "SQLite recursive queries must start with a single WITH RECURSIVE clause; do not write RECURSIVE before an individual CTE name."
  - "Every CTE must include a proper SELECT clause and, when needed, an explicit column list in the CTE header."
  - "Use CAST(expr AS REAL) or CAST(expr AS INTEGER) in SQLite instead of PostgreSQL-style type casts such as ::FLOAT."
  - "Use date parsing or regex extraction for free-text date columns; do not assume the year is always the last four characters."
  - "Window functions require explicit OVER clauses and cannot be nested inside other window expressions or aggregate expressions."
  - "Prefer ROW_NUMBER() for deterministic deduplication and use an outer query or CTE to filter window results."
  - "Use strftime, substr, or regexp-style extraction only when the underlying text format is verified by samples."
  - "Treat TEXT columns as TEXT unless the schema or sample values prove they are JSON and can be expanded safely."
  - "For multi-table datasets, join on authoritative key columns and verify the join grain before aggregating."
  - "Every non-aggregated SELECT expression must appear in GROUP BY."
  - "regexp_extract(string, pattern, group) is available as a registered Python UDF — the ONLY correct way to extract structured values (years, IDs, codes) from free-text columns. CRITICAL: Never use LIKE/GLOB patterns with substr/instr to extract years — they incorrectly match year-like fragments (e.g., 'January 20,' extracts prefix '20' instead of '2023'; 'reviewed 19 times' extracts '19' instead of a year). Always use regexp_extract with a strict pattern: CAST(regexp_extract(col, '(19[0-9]{2}|20[0-9]{2})', 1) AS INTEGER)."
  - "When join keys use different prefixes but share a numeric suffix (e.g., 'purchaseid_42' links to 'bookid_42'), use REPLACE or SUBSTR to normalize: REPLACE(a.purchase_id, 'purchaseid_', 'bookid_') = b.book_id. Always check sample values of both ID columns to discover the mapping."
  - "To compute a decade (e.g., 2020s) from a 4-digit year: (CAST(year AS INTEGER) / 10) * 10 — this yields 2020 for years 2020-2029, 2010 for 2010-2019. Never use modulo or partial truncation that yields a 2-digit number like 20 or 10."
  - "JSON columns: use json_extract(col, '$.field') to read fields. For JSON arrays of objects, use json_each(): SELECT j.value FROM table, json_each(table.json_col) AS j."
  - "Keep SQL portable across SQLite by avoiding dialect-specific constructs that are not validated by sample execution."

examples:
  - name: "Extract 4-digit year from free-text column (correct vs wrong)"
    sql: |
      -- WRONG: instr/LIKE matches year-fragments in non-year contexts
      -- e.g. 'January 20, 2023' -> instr finds '20' at 'January 20,' -> extracts '20, ' -> pub_year=20 -> decade=20
      -- e.g. 'reviewed 19 times' -> instr finds '19' -> extracts '19 t' -> pub_year=19 -> decade=10

      -- CORRECT: regexp_extract with strict 4-digit year pattern
      SELECT
        CAST(regexp_extract(details_col, '(19[0-9]{2}|20[0-9]{2})', 1) AS INTEGER) AS pub_year,
        (CAST(regexp_extract(details_col, '(19[0-9]{2}|20[0-9]{2})', 1) AS INTEGER) / 10) * 10 AS decade
      FROM books_table
      WHERE regexp_extract(details_col, '(19[0-9]{2}|20[0-9]{2})', 1) != ''

  - name: "Recursive EMA pattern"
    sql: |
      WITH RECURSIVE base AS (
        SELECT 1 AS n
      ),
      step AS (
        SELECT n FROM base
      )
      SELECT n FROM step
