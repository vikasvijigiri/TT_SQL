networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # -- React Frontend (dev hot-reload) --------------------------------------
  frontend:
    build:
      context: ./apps/web
      target: dev
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./apps/web/src:/app/src
    networks:
      - app-net
    command: npm run dev -- --host
    restart: unless-stopped

  # -- Go API Gateway --------------------------------------------------------
  gateway:
    build: ./services/gateway
    ports:
      - "${GO_PORT:-8002}:${GO_PORT:-8002}"
    env_file:
      - .env
    environment:
      GO_PORT: "${GO_PORT:-8002}"
      GIN_MODE: debug
      PYTHON_API_URL: "http://agent:${PYTHON_PORT:-8010}"
      BACKEND_DATA_DIR: /data
      DATABASE_DIR: /database
    volumes:
      - ./services/agent-service/agent:/data
      - ./data:/database
    networks:
      - app-net
    depends_on:
      - postgres
      - redis
      - agent
    restart: unless-stopped

  # -- Python AI Agent -------------------------------------------------------
  agent:
    build: ./services/agent-service
    ports:
      - "${PYTHON_PORT:-8010}:${PYTHON_PORT:-8010}"
    env_file:
      - .env
    environment:
      PYTHON_PORT: "${PYTHON_PORT:-8010}"
      BACKEND_DATA_DIR: /app/agent
      DATABASE_DIR: /database
      DATABASE_HOST: postgres
      DATABASE_PORT: "${DATABASE_PORT:-5432}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
    volumes:
      - ../DataAgentBench:/DataAgentBench:ro
      - ./data:/database
    networks:
      - app-net
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # -- PostgreSQL -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-ttsql}"
      POSTGRES_USER: "${DATABASE_USER:-ttsql}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-changeme}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ttsql} -d ${DATABASE_NAME:-ttsql}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -- Redis ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
