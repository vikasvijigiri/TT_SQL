services:
  backend:
    build: ./backend
    container_name: nquire-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app/data:/app/app/data
      - ./backend/app/repositories/logs:/app/app/repositories/logs
    restart: always

  # Optional: Local Qdrant instance for development
