networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    expose:
      - "${FRONTEND_PORT:-3000}"
    networks:
      - app-net
    depends_on:
      - gateway
    restart: unless-stopped

  # ── Go API Gateway ────────────────────────────────────────────────────────
  gateway:
    build: ./backend/gateway
    expose:
      - "${GO_PORT:-8002}"
    env_file:
      - .env
    environment:
      GO_PORT: "${GO_PORT:-8002}"
      GIN_MODE: "${GIN_MODE:-release}"
      PYTHON_API_URL: "http://agent:${PYTHON_PORT:-8001}"
      BACKEND_DATA_DIR: /data
    volumes:
      - ./backend/agent/agent:/data
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:${GO_PORT:-8002}/api/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Python AI Agent ───────────────────────────────────────────────────────
  agent:
    build: ./backend/agent
    expose:
      - "${PYTHON_PORT:-8001}"
    env_file:
      - .env
    environment:
      PYTHON_PORT: "${PYTHON_PORT:-8001}"
      BACKEND_DATA_DIR: /app/agent
      DATABASE_HOST: postgres
      DATABASE_PORT: "${DATABASE_PORT:-5432}"
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      DAB_REPO: /DataAgentBench
      AWS_ACCESS_KEY_ID: "${BEDROCK_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${BEDROCK_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${BEDROCK_REGION:-us-east-1}"
      AWS_REGION: "${BEDROCK_REGION:-us-east-1}"
    volumes:
      - ../DataAgentBench:/DataAgentBench:ro
      - ./backend/agent/agent/results:/app/agent/results
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-ttsql}"
      POSTGRES_USER: "${DATABASE_USER:-ttsql}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-changeme}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ttsql} -d ${DATABASE_NAME:-ttsql}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    networks:
      - app-net
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
