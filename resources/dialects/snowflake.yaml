dialect: snowflake
rules:
  # Syntax & Dialect Basics
  - name: FQN Compliance
    rule: "Always use Fully Qualified Names (FQN) in the format `DATABASE.SCHEMA.TABLE`."
  - name: Identifier Quoting
    rule: "Always double-quote all identifiers (tables, columns, aliases) to handle case-sensitivity and special characters: `\"ColumnName\"`."
  - name: String Search
    rule: "Prefer `ILIKE` over `LIKE` for case-insensitive categorical filtering on string columns."
  - name: Null Handling
    rule: "Use `COALESCE(\"ColumnName\", 'default')` when performing negative filters (e.g., `!= 'value'`) to avoid dropping NULL records."
  - name: List Aggregation
    rule: "Use `LISTAGG(DISTINCT \"Column\", ', ') WITHIN GROUP (ORDER BY ...)` for comma-separated outputs."

  # Advanced Structural Patterns (Learnings)
  - name: Ambiguity Prevention
    rule: "In complex queries with multiple CTEs or joins, ALWAYS prefix every column in the SELECT and JOIN clauses with its respective table or CTE alias (e.g., `alias.\"Column\"`) to prevent 'ambiguous column name' errors."
  - name: Numerical Date Pattern
    rule: "If a date is stored as a NUMBER (e.g., YYYYMMDD), use `TRY_TO_DATE(TO_VARCHAR(\"ColumnName\"), 'YYYYMMDD')`. Always filter out NULLs using `WHERE ... IS NOT NULL` after conversion."
  - name: Deep Variant Access
    rule: "When accessing fields inside a flattened VARIANT array, use the syntax `alias.VALUE:\"field_name\"::TEXT`. Always cast to TEXT before comparison."
  - name: CTE Persistence
    rule: "If you alias a column inside a CTE (e.g., `SELECT \"col\" AS \"alias\"`), you MUST use that exact quoted alias in all downstream CTEs and the final SELECT. Do not drop quotes or change casing."
  - name: Single-Row Join Strategy
    rule: "When joining a CTE that is guaranteed to have only one row (e.g., a 'top winner' or 'summary' CTE), use `CROSS JOIN` explicitly to join it to the main dataset."
