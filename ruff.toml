# Ruff Configuration
# Target version: Python 3.13
target-version = "py313"

[lint]
# Enable specific rules
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "DOC",  # pydoclint
]
ignore = []

# Allow autofix for all enabled rules (when supported).
fixable = ["ALL"]
unfixable = []

[format]
# Standard formatting choices
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
