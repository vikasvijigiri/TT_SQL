batch:
  workers: 1
data_iq:
  placeholders:
  - --
  - ' '
  - '""'
  - '" "'
  - \
  - ------
  - nan
  - None
  - 'NULL'
  preview_row_limit: 10
llm:
  max_retries: 3
  max_tokens: 16000
  model: bedrock/openai.gpt-oss-safeguard-120b
  fast_model: bedrock/openai.gpt-oss-safeguard-120b
  prompt_caching_models:
  - claude-3-5
  - claude-3-haiku
  - claude-3-7
  - claude-4
  - nova
  retry_base_delay_s: 1
  temperature: 0.0
orchestrator:
  max_retries: 2
  pruning_threshold_tokens: 3500
  research_term_limit: 2
  token_heuristic: 4
schema_engine:
  homogeneous_threshold: 8
