bigquery:
  builder_instructions: |
    - Use GoogleSQL (Standard SQL) syntax.
    - Prefer backticks `project.dataset.table` for fully qualified table names to handle project IDs correctly.
    - Use CURRENT_DATE() and TIMESTAMP() for date/time literals.
    - Use SAFE_DIVIDE(x, y) to avoid division by zero errors.
    - ROUNDING: Prefer rounding numeric results to 2 decimal places using ROUND(x, 2).
    - KEYWORDS: Avoid using inbuilt functions or reserved keywords for aliases (e.g., avoid 'year', 'date').
  critic_instructions: |
    - Validate against GoogleSQL syntax.
    - Check for appropriate table qualification.
    - Ensure date literals use standard BigQuery formats.
    - Verify division safety with SAFE_DIVIDE.

postgresql:
  builder_instructions: |
    - Use PostgreSQL compatible syntax.
    - Use CURRENT_DATE for the current date.
    - Use INTERVAL and DATE_TRUNC for date arithmetic and grouping.
    - Use ILIKE for case-insensitive matching where appropriate.
    - ROUNDING: Use ROUND(v::numeric, 2) for numeric results.
    - SCHEMA QUALIFICATION: Qualify table names with the schema name ("schema"."table") to avoid ambiguity.
    - Prefer native PostgreSQL functions (e.g., COALESCE, NULLIF) for reliability.
  critic_instructions: |
    - Validate against PostgreSQL syntax.
    - Check for correct date and interval usage.
    - Ensure results are rounded appropriately.
    - Verify schema-qualified table references.

sqlite:
  builder_instructions: |
    - Use standard SQLite syntax.
    - Use date('now') for current date.
    - Use datetime(col, '+1 month') for date arithmetic.
    - CRITICAL: For ALL divisions, use CAST(numerator AS REAL) / denominator to avoid integer division truncation (e.g., CAST(balls AS REAL) / wickets).
    - PRECISION: For calculations like Economy Rate or Strike Rate, use ROUND(expr, 4) to ensure consistency with high-precision evaluation.
    - Use LOWER(col) = LOWER('val') for case-insensitive matching.
    - STRING CONSISTENCY: Always use ValueDiscovery to check for pluralization (e.g., 'wides' vs 'wide') or spelling in the DB.
  critic_instructions: |
    - Validate against SQLite syntax.
    - Ensure proper division casting.
    - Verify date function correctness.

snowflake:
  builder_instructions: |
    - Use Snowflake SQL syntax and semantics.
    - MANDATORY QUOTING: Always double-quote identifiers exactly as they are provided in the [SCHEMA].
    - Snowflake converts unquoted identifiers to UPPERCASE; use double-quotes (`"Id"`, `"Column_Name"`) to preserve case-sensitivity and handle spaces or special characters.
    - Use double-quotes if the identifier matches a reserved keyword (e.g., `"GROUP"`, `"ORDER"`).
    - Use CURRENT_DATE(), DATEADD(), and DATE_TRUNC() for temporal logic.
    - Use ILIKE for case-insensitive string matching.
    - Use IFF() or TRY_DIVIDE() for conditional calculations.
    - Use QUALIFY for window-based filtering.
  critic_instructions: |
    - MANDATORY: Verify all Snowflake identifiers (tables, columns) are double-quoted.
    - Validate Snowflake syntax correctness.
    - Check for idiomatic Snowflake function usage (DATEADD, TRY_DIVIDE, etc.).
    - Detect potential runtime risks (NULLs, precise division).

duckdb:
  builder_instructions: |
    - Use DuckDB syntax.
    - Always use the full table name in query with schema name (e.g., `main.table_name`).
    - Use current_date for the current date.
    - Use INTERVAL for date arithmetic.
    - For percentages, use `100 * (a - b) / a` to prevent rounding issues.
  critic_instructions: |
    - Verify full table name qualification (schema.table).
    - Ensure arithmetic safety for percentages (multiply first).

default:
  builder_instructions: |
    - Use standard SQL syntax.
    - Prioritize clarity, readability, and correctness.
    - Use explicit JOIN conditions.
    - Prefer CTEs (WITH clause) over deep nesting for complex transformations.
    - Handle NULL values explicitly where they might affect aggregations.
    - When calculating percentages like (a - b) / a * 100, multiply first: `100 * (a - b) / a`.
  critic_instructions: |
    - Validate standard SQL syntax.
    - Ensure logical correctness of filters and grouping.
    - Verify "multiply before divide" for all percentage calculations.
