postgresql:
  builder_instructions: |
    - YOU MUST ONLY USE POSTGRESQL COMMANDS. ANY SQLITE-SPECIFIC SYNTAX WILL CAUSE A FATAL ERROR.
    - Use CURRENT_DATE for the current date. NEVER use date('now').
    - Use INTERVAL for date arithmetic (e.g., col + INTERVAL '1 month').
    - Use DATE_TRUNC('month', col) for month-level grouping or filtering.
    - Use ILIKE for case-insensitive matching.
    - ROUND OFF: ALWAYS round numeric results, percentages, and averages to 2 decimal places using ROUND(v::numeric, 2).
    - DATE CASTING: For columns containing dates as strings (character varying), you MUST use TO_DATE(col, 'YYYY-MM-DD') before comparison or truncation.
    - Use NULLIF(denominator, 0) to prevent division by zero.
    - SCHEMA QUALIFICATION: You MUST always qualify table names with the provided schema name in double quotes (e.g., "schema_name"."table_name").
    - PRIORITIZE INBUILT FUNCTIONS: Use native PostgreSQL functions (e.g., DATE_TRUNC, COALESCE, GREATEST, LEAST) whenever possible instead of complex manual logic.
  critic_instructions: |
    - STRICTLY VALIDATE AGAINST POSTGRESQL SYNTAX. FAIL IF ANY SQLITE COMMANDS ARE USED.
    - Ensure CURRENT_DATE is used instead of date('now').
    - Ensure DATE_TRUNC('month', col) is used for month groupings.
    - FAIL IF ROUND(v, d) IS USED WITHOUT CASTING. PostgreSQL does not support it for double precision directly unless cast to numeric.
    - Ensure native PostgreSQL functions (COALESCE, NULLIF, etc.) are used where appropriate.
    - Verify all tables are qualified with the table in the schema'.

sqlite:
  builder_instructions: |
    - Use SQLite syntax only.
    - Use date('now') for current date.
    - Use datetime(col, '+1 month') for date arithmetic.
    - For division: CAST(x AS REAL) / y.
    - No ILIKE, use LOWER(col) = LOWER('val').
    - No POWER() function, use x * x.
  critic_instructions: |
    - Validate against SQLite syntax.
    - Check for date('now') and numeric types.
    - No ILIKE allowed.

bigquery:
  builder_instructions: |
    - Use GoogleSQL (Standard SQL) syntax.
    - Identifiers (project, dataset, table) MUST be enclosed in backticks, e.g., `project.dataset.table`.
    - Use CURRENT_DATE() for the current date.
    - Use DATE_ADD(date_col, INTERVAL 1 MONTH) for date arithmetic.
    - Use SAFE_DIVIDE(x, y) to prevent division by zero.
    - Use FORMAT_DATE('%Y-%m', date_col) for month-level grouping.
    - String literals use single quotes. Case-insensitive matching requires LOWER().
  critic_instructions: |
    - Ensure identifiers are backticked.
    - Validate date functions (CURRENT_DATE(), DATE_ADD).
    - Ensure backticks are used for table names.

snowflake:
  builder_instructions: |
    - Use Snowflake SQL syntax and semantics.
    - Prefer unquoted identifiers unless case sensitivity is explicitly required.
    - Use fully qualified table names when ambiguity exists.

    - Use CURRENT_DATE() for current date.
    - Use DATEADD(part, value, date_col) for date arithmetic.
    - Use DATE_TRUNC('part', date_col) for aggregation.

    - Use ILIKE for case-insensitive matching.
    - Use IFF() or DIV0() for safe division.

    - Prefer CTEs over nested queries.
    - Use QUALIFY for window filtering.

    - NEVER use scalar subqueries.
    - NEVER use correlated subqueries.
    - ALWAYS rewrite logic using JOINs.

    - Prefer ROW_NUMBER() + QUALIFY instead of LIMIT.

    - Ensure deterministic ORDER BY.
    - Minimize repeated scans.

  critic_instructions: |
    - Validate Snowflake syntax correctness.
    - Ensure DATEADD / DATE_TRUNC usage is correct.
    - Detect scalar subqueries (not allowed).
    - Validate column existence and alias correctness.
    - Ensure JOIN correctness and no cross joins.
    - Detect runtime risks (NULL, casting, division).
    - Ensure deterministic ordering.

default:
  builder_instructions: |
    - Use standard SQL syntax.
    - Ensure clarity and correctness.

    - Use explicit JOIN conditions.
    - Avoid ambiguous columns.

    - Prefer CTEs for readability.
    - Avoid unnecessary nesting.

    - Handle NULLs explicitly.
    - Ensure deterministic ordering.

  critic_instructions: |
    - Validate SQL syntax.
    - Ensure logical correctness of joins and filters.
    - Detect invalid column references.
    - Check for ambiguity or missing conditions.
    - Ensure proper NULL handling.