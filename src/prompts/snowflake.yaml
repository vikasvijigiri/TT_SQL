snowflake:
  planner_instructions: |
    - VARIANT HANDLING (CRITICAL):
      - If VARIANT structure (keys) is NOT provided:
        → DO NOT assume keys
        → add to missing_elements
        → set expansion_required = true

      - ONLY use keys explicitly defined in [SCHEMA]

      - If VARIANT access is required:
        → mark source_type = "variant_required"

    ------------------------------------------------------------

    - AGGREGATION SEMANTICS (MANDATORY):

      Before choosing aggregation:

      1. Identify:
         - entity being counted (E)
         - what one row represents (source grain)

      2. Determine:
         - does transformation (JOIN, FLATTEN, etc.) create multiple rows per entity?

      3. Determine intent:
         - are we counting rows or unique entities?

      RULE:

      - If rows represent entities directly:
        → use COUNT(*)

      - If multiple rows can represent same entity AND question requires unique entities:
        → use COUNT(DISTINCT E)

      - DISTINCT must NEVER be used by default.
      - DISTINCT must ALWAYS be justified by aggregation intent.

    ------------------------------------------------------------

    - CLASSIFICATION FILTER:
      - If filtering VARIANT key "code":
        → treat equality as prefix (hierarchical)
        → do not assume exact match unless explicitly requested

    ------------------------------------------------------------

    - MULTI-FLATTEN RISK:
      - If multiple independent VARIANT arrays are flattened:
        → assume row multiplication risk
        → require aggregation strategy to account for duplication


  builder_instructions: |
    - Use Snowflake SQL syntax and semantics.

    ------------------------------------------------------------

    - IDENTIFIER RULES (STRICT):

      - ALL table, schema, and column names MUST be double-quoted
      - EXCEPT:
        → FLATTEN alias (e.g., f)
        → special column `value` (must NOT be quoted)

      - Preserve exact case from [SCHEMA]
      - MANDATORY: If a column name is ALREADY in lower case, it MUST ALWAYS be double-quoted (e.g., "my_column") in the entire SQL query at all places strictly and mandatorily.

    ------------------------------------------------------------

    - VARIANT SYNTAX (CRITICAL):

      → Use:
        alias.value:"key"::TYPE

      → Example:
        f.value:"application_number"::STRING

      → NEVER use:
        "f"."value"
        f."value"

    ------------------------------------------------------------

    - FLATTEN USAGE:

      → Always:
        CROSS JOIN LATERAL FLATTEN(input => table."variant_column") alias

      → DO NOT alias FLATTEN output columns manually
      → Use default columns:
        VALUE, KEY, INDEX, PATH, SEQ, THIS
      → CRITICAL: These column names are stored as UPPERCASE.
        → Access them as unquoted (f.INDEX, f.VALUE) or quoted UPPERCASE (f."INDEX", f."VALUE").
        → NEVER use lower-case quoted aliases like f."index" or f."value".

    ------------------------------------------------------------

    - AGGREGATION RULE:

      - Use COUNT(*) by default

      - Use COUNT(DISTINCT entity) ONLY IF:
        → multiple rows per entity exist
        → AND unique entity counting is required

    ------------------------------------------------------------

    - Use Snowflake idioms:

      - CURRENT_DATE()
      - DATEADD()
      - DATE_TRUNC()
      - ILIKE
      - IFF()
      - TRY_DIVIDE()
      - QUALIFY (for window filtering)

    ------------------------------------------------------------

    - NUMERIC DATE HANDLING (YYYYMMDD):
      - If extracting a YEAR/MONTH from a numeric column formatted as YYYYMMDD (e.g. NUMBER(38,0)):
        → Cast it to VARCHAR and then TO_DATE before applying date logic.
        → Example: DATE_PART('year', TO_DATE(p."filing_date"::VARCHAR, 'YYYYMMDD'))
        → NEVER apply EXTRACT or DATE_PART directly to raw numeric dates.

    ------------------------------------------------------------

    - CLASSIFICATION SQL:
      - For VARIANT key "code":
        IF operator "="
        → generate: alias.value:"code"::STRING LIKE '<input>%'
        (cast to STRING; use dynamic input; no hardcoding)

    ------------------------------------------------------------

    - WINDOW DETERMINISM:
      - ROW_NUMBER() must include tie-breaker:
        ORDER BY metric DESC, stable_column ASC

    ------------------------------------------------------------

    - GROUPING SAFETY:
      - Exclude NULL grouping keys unless explicitly required

    ------------------------------------------------------------

    - DATE SAFETY:
      - If date is numeric/string:
        → prefer TRY_TO_DATE
        → avoid strict TO_DATE assumptions

    ------------------------------------------------------------

    - CTE ALIAS SCOPING (STRICT):
      - When writing subqueries or CTEs, ensure aliases from parent or sibling CTEs are NOT referenced unless explicitly joined.
      - Never reference an original table alias (e.g., `p."publication_number"`) within a derived aggregate CTE unless that alias is explicitly mapped or brought into scope.

  critic_instructions: |
    - MANDATORY: All identifiers must be double-quoted
      (except FLATTEN alias and `value` column)
    - CRITICAL: If a column name is ALREADY in lower case, it MUST ALWAYS be double-quoted (e.g., "my_column") in the entire SQL query at all places strictly and mandatorily.

    ------------------------------------------------------------

    - SYNTAX VALIDATION:
      - Ensure valid Snowflake SQL
      - Ensure proper quoting and casing

    ------------------------------------------------------------

    - VARIANT VALIDATION:

      - Must follow:
        alias.value:"key"

      - Reject:
        "alias"."value"
        alias."value"

    ------------------------------------------------------------

    - FLATTEN & DUPLICATION ANALYSIS (CRITICAL):

      1. Detect row expansion caused by:
         - FLATTEN
         - JOIN
         - multi-valued fields

      2. Identify aggregation target:
         - rows vs entities

      ------------------------------------------------------------

      RULE:

      - If aggregation counts rows:
        → COUNT(*) required

      - If aggregation counts entities after expansion:
        → COUNT(DISTINCT entity) required

      - DISTINCT must NOT be used without justification

      ------------------------------------------------------------

      FAIL if:
        - DISTINCT used without aggregation need
        - DISTINCT missing when duplication causes overcount

    ------------------------------------------------------------

    - AGGREGATION CONSISTENCY:

      - Ensure GROUP BY matches aggregation grain
      - Ensure no overcount or undercount

    ------------------------------------------------------------

    - RUNTIME SAFETY:

      - Check NULL handling
      - Ensure safe division (TRY_DIVIDE)
      - Validate date functions

    ------------------------------------------------------------

    - PRIORITY:

      Prefer SEMANTIC correctness over syntactic acceptance
