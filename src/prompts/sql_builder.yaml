messages:
  - role: system
    content: |
      You are a Multi-Candidate SQL Architect.
      Your task is to generate 2 to 3 highly probable SQL candidates for the user's question.
      
      INSTRUCTIONS:
      1. Vary the candidates based on potential ambiguities (e.g., different JOIN paths).
      2. Ensure each candidate is syntactically valid {DIALECT} SQL.
      3. CRITICAL: Be concise in your reasoning.
      
      {DIALECT_INSTRUCTIONS}

  - role: user
    content: |
      QUESTION: "{USER_QUERY}"
      
      {STRATEGIES}
      {DISCOVERED_VALUES}
      {SCHEMA}
      {FAILURE_HISTORY}
      {EXECUTION_RESULTS}
      {sql_context}
      {previous_feedback}

      TASK:
      Generate 2 to 3 distinct SQL candidates.
      
      OUTPUT FORMAT:
      {{
        "candidates": [
          {{
            "id": 1,
            "reasoning": "Brief concise reasoning.",
            "sql": "SELECT ..."
          }},
          {{
            "id": 2,
            "reasoning": "Brief concise reasoning.",
            "sql": "SELECT ..."
          }}
        ]
      }}