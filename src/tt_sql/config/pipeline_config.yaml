defaults:
  query_intent: "DATA_RETRIEVAL"
  complexity_score: "MEDIUM"
  max_retries: 5
  fallback_plan: ["Analyze Schema", "Generate SQL"]

labels:
  critic_feedback_header: "\n\nCRITIC FEEDBACK (YOU MUST FIX ALL ISSUES BELOW):\n"
  previous_sql_error_label: "PREVIOUS SQL (HAS ERRORS AND CONTINUES TO FAIL — YOU MUST FIX ALL ISSUES BELOW):\n"
  planning_roadmap: "Execution Roadmap"
  planning_step_prefix: "PLAN_STEP: - "
  schema_header: "AVAILABLE DATABASE SCHEMA:"
  instructions_header: "INSTRUCTIONS:"
  intent_header: "INTENT ANALYSIS:"
  final_task_label: "TASK:"
  final_output_label: "OUTPUT FORMAT (JSON ONLY):"

prompts:
  global:
    brand_name: "Text-to-SQL Pipeline"
    assistant_role: "Advanced AI Data Analyst"
  agents:
    TableSelector:
      role: "specialized Data Architect Agent"
      task: "identify the EXACT subset of tables required to answer the user's query"
    QueryPlanner:
      role: "specialized Query Planning Agent"
      task: "break down complex natural language queries into a logical sequence of data retrieval and calculation steps"
    SQLBuilder:
      role: "STRICT {dialect} SQL generation agent"
      task: "Generate SQL that solves the USER QUERY in shortest code possible"
    SQLCritic:
      role: "SQL review agent"
      task: "Evaluate the provided SQL query against the user query, schema, and execution results. Identify issues if present, but approve the query if it correctly answers the question."
    Analyst:
      role: "expert Text-to-SQL analyst and debugger"
      task: "analyze a failed attempt to convert a natural language question into a SQL query"

llm:
  default_max_tokens: 2048
  temperature: 0.0

pipeline:
  execution_order:
    - agent: "TableSelector"
      enabled: true
    - agent: "QueryPlanner"
      enabled: true
    - agent: "RefinementLoop"
      enabled: true
    - agent: "SQLiteExecutor"
      enabled: true
    - agent: "PostgresExecutor"
      enabled: true
    - agent: "BigQueryExecutor"
      enabled: true
