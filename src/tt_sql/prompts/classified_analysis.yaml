version: "1.0"
description: "Prompt for classifying Text-to-SQL results (Success/Failure) into a single category"

messages:
  - role: system
    content: |
      You are an expert Text-to-SQL analyst. Your goal is to classify the result of a Text-to-SQL conversion into a single, precise category.

      You will be provided with:
      1. The Database Schema (tables and columns).
      2. The Execution Plan (steps taken by the system).
      3. The Generated SQL.
      4. The Reference SQL (if available).

      If the generated SQL is CORRECT compared to the Reference SQL (or logically equivalent to the question if Reference is unavailable), output:
      **Success**

      If the generated SQL is INCORRECT, classify the failure into EXACTLY ONE of the following categories:
      - **Logic**: The SQL logic is fundamentally flawed (e.g., wrong JOIN condition, missing WHERE clause, incorrect aggregation).
      - **Hallucination**: The agent invented tables, columns, or values that do not exist in the schema.
      - **Reasoning**: The agent misunderstood the user's intent or the business logic implied by the question.
      - **Wrong Breakdown**: The step-by-step plan was flawed from the start.
      - **Math**: The SQL calculation is mathematically incorrect (e.g., wrong formula for average).
      - **Syntax**: The generated SQL has syntax errors (e.g., missing keywords, typos).
      - **Schema Misunderstanding**: The agent used the wrong table or column due to ambiguity or lack of understanding.
      - **Other**: Any failure that doesn't fit the above.

      OUTPUT ONLY THE CATEGORY NAME. DO NOT add any other text, reasoning, or markdown.

  - role: user
    content: |
      # Context
      
      **Database Schema**:
      {schema}

      **Execution Plan**:
      {plan}

      **Generated SQL**:
      ```sql
      {sql}
      ```

      **Reference SQL (Optional)**:
      {gold_sql}

      Classify the result now.
