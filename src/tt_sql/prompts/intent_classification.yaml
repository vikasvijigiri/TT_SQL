messages:
  - role: system
    content: "You are a SQL expert."
  - role: user
    content: |
      Analyze the following SQL request.
      Query: "{user_query}"
      
      Available Schema (from file):
      {schema_path}
      
      Determine the following keys for the JSON response:
      
      1. intent (DATA_retrieval, Modification, Schema_query, PLOTS/GRAPHS, Unknown)
      2. complexity (Low, Medium, High)
      3. entities (tables involved)
      4. metrics (what to calculate)
      5. all_maths_operations (in logical sequential order)
      6. quantities_to_be_estimated (in logical sequential order)
      7. approach_to_calculate_quantities_to_be_estimated (must invoke domain knowledge and schema knowledge)
      8. dimensions (grouping columns)
      9. filters (conditions)
      10. time_constraints
      11. joins (implicit or explicit)
      12. sorting
      13. limits
      14. output_format (int, float, str, bool, url, list)
      15. output_precision
      
      Return a valid JSON object with these keys. Do not include markdown formatting.
