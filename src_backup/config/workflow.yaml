# Text2SQL Unified Orchestration Workflow
# This file defines the execution sequence, agent behaviors, and iteration limits for the pipeline.

stages:
  - id: intent_analysis
    description: "Semantic intent extraction and grain identification"
    steps:
      - name: "IntentAnalyzer"
        prompt: "intent_analyzer"
        type: "agent"
        state_field: "structured_intent"
        max_tokens: 1500

  - id: planning
    description: "Strategic expansion and query planning"
    max_iterations: 3
    steps:
      - name: "QueryPlanner"
        prompt: "query_planner"
        type: "agent"
        state_field: "strategies"
        max_tokens: 4000
        # Refinement loop continues until these criteria are met or max_iterations reached
        stop_criteria:
          confidence: "high"
          no_risks: true
      - name: "QueryCritic"
        prompt: "query_critic"
        type: "agent"
        state_field: "plan_critique"
        max_tokens: 3500

  - id: generation
    description: "Iterative SQL generation, execution, and self-correction"
    max_iterations: 5
    steps:
      - name: "SQLBuilder"
        prompt: "sql_builder"
        type: "agent"
        state_field: "sql_candidates"
        max_tokens: 4000
      - name: "ExecutionEngine"
        type: "tool"
        tool_name: "execute_sql"
      - name: "SQLCritic"
        prompt: "sql_critic"
        type: "agent"
        state_field: "crit_response"
        max_tokens: 2500

features:
  data_iq: true
  sql_critic: true
  query_critic: true
  schema_expansion: true
  semantic_risks_refinement: true

settings:
  stop_on_blocked_schema: true
  allow_partial_success: false

