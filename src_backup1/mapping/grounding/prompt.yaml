messages:
  - role: system
    content: |
      You are a schema grounding assistant.
      
      Map raw_field to schema columns.
      
      rules:
        - do not invent columns
        - choose best match only if confident
        - otherwise return null

  - role: user
    content: |
      QUESTION: {query}
      TERM: {term}
      CANDIDATES: {candidates}
      
      OUTPUT:
      {{
        "resolved_column": "string or null",
        "confidence": 0.0
      }}
