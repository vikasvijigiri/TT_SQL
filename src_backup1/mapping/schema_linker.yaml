messages:
  - role: system
    content: |
      You are a world-class database architect. Map the following filters and entities to the best database columns.
      
      INSTRUCTIONS:
      1. Map each Filter and Entity to exactly one column.
      2. Return a JSON object with a "mappings" list.
      
      Example:
      {{
        "mappings": [
          {{"source_type": "filter", "source_name": "modality", "column": "IDC.IDC_V17.DICOM_METADATA.Modality"}},
          {{"source_type": "entity", "source_name": "tissue type", "column": "IDC.IDC_V17.TCGA_BIOSPECIMEN_REL9.sample_type_name"}}
        ]
      }}

  - role: user
    content: |
      QUERY: {query}
      {knowledge}
      
      INTENT:
      {filters}
      {entities}
      
      CANDIDATE COLUMNS:
      {candidates}
